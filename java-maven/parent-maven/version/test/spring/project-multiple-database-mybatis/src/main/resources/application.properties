spring.application.name=project-multiple-database-mybatis

#spring.datasource.url=jdbc:mysql://localhost:3306/mds
#spring.datasource.username=root
#spring.datasource.password=Welcome@123
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#db1 connection details
spring.datasource.mysql.url=jdbc:mysql://localhost:3306/mds
spring.datasource.mysql.username=root
spring.datasource.mysql.password=Welcome@123
spring.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

#db2 connection details
spring.datasource.postgresql.url=jdbc:postgresql://localhost:5432/mds
spring.datasource.postgresql.username=postgres
spring.datasource.postgresql.password=Welcome@123
spring.datasource.postgresql.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=create
#spring.jpa.generate-ddl=true
#spring.jpa.open-in-view=false

# MyBatis Mapper locations (if XML used)
mybatis.mapper-locations=classpath*:mappers/**/*.xml
mybatis.type-aliases-package=com.company.projectmultipledatabasemybatis.model
mybatis.configuration.map-underscore-to-camel-case=true

spring.flyway.mysql.enabled=true
spring.flyway.mysql.locations=classpath:db/migration/mysql
spring.flyway.mysql.url=jdbc:mysql://localhost:3306/mds
spring.flyway.mysql.user=root
spring.flyway.mysql.password=Welcome@123
spring.flyway.mysql.baseline-on-migrate=true

spring.flyway.postgresql.enabled=true
spring.flyway.postgresql.locations=classpath:db/migration/postgresql
spring.flyway.postgresql.url=jdbc:postgresql://localhost:5432/mds
spring.flyway.postgresql.user=postgres
spring.flyway.postgresql.password=Welcome@123
spring.flyway.postgresql.baseline-on-migrate=true

